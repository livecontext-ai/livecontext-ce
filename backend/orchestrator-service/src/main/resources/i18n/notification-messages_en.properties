# Notification emails and chat notices (NotificationMessageComposer). UTF-8.
# Every key must exist in all six locales with the same {placeholders}: NotificationCatalogParityTest.
# Plural keys come in pairs, .one and .other (MessageCatalog.pluralCategory picks one).
# No em or en dash anywhere.

# java.time pattern for every date shown; the time zone id is appended in parentheses.
format.datetime=MMM d, yyyy, h:mm a

name.untitled=Untitled
name.billing=Credits

action.open_run=Open the run
action.open_workflow=Open the workflow
action.add_credits=Add credits
action.open_app=Open LiveContext

failure.rationed=While it keeps failing you will get at most one reminder a day, and one message when it runs successfully again.

run_failed.subject=Workflow failed: {name}
run_failed.line1=Your production workflow "{name}" failed at {time}.

failing_again.subject=Failing again: {name}
failing_again.line1="{name}" failed again at {time}, after it had recovered.

budget.subject=Workflow stopped on its spending cap: {name}
budget.line1="{name}" spent {spent} of its {cap} credit cap for this period.
budget.line2=It will not run again until the period resets or the cap is raised.

credit_low.subject=Your LiveContext credits are running low
credit_low.line1.one=About {count} credit is left in this cycle.
credit_low.line1.other=About {count} credits are left in this cycle.
credit_low.line2=When they run out, workflows and agents that use credits stop.

credit_exhausted.subject=You are out of LiveContext credits
credit_exhausted.line1=Workflows and agents that use credits are stopping.
credit_exhausted.line2=Add credits or change plan to resume them.

reminder.subject=Still failing: {name}
reminder.line1.one="{name}" failed {count} more time since {time}.
reminder.line1.other="{name}" failed {count} more times since {time}.
reminder.line2.one=It first failed at {time}, {count} failure in total. Next reminder in 24 hours if it is still failing.
reminder.line2.other=It first failed at {time}, {count} failures in total. Next reminder in 24 hours if it is still failing.

recovered.subject=Recovered: {name}
recovered.line1="{name}" ran successfully again.
recovered.line2.one=It had failed {count} time between {from} and {to}.
recovered.line2.other=It had failed {count} times between {from} and {to}.

digest.subject.one=Your LiveContext summary: {count} item
digest.subject.other=Your LiveContext summary: {count} items
digest.intro.one={count} thing needs your attention:
digest.intro.other={count} things need your attention:
digest.item=- {label}: {name}
digest.more.one=- and {count} more in the app
digest.more.other=- and {count} more in the app

category.RUN_FAILED=Workflow failed
category.BUDGET_REACHED=Workflow stopped on its spending cap
category.CREDIT_LOW=Credits running low
category.CREDIT_EXHAUSTED=Out of credits
category.CRED_EXPIRED=Credential expired
category.WEBHOOK_TRIGGER_DISABLED=Trigger switched off
category.AGENT_TASK_ASSIGNED=Task assigned to you
category.AGENT_TASK_MENTION=You were mentioned in a task
category.AGENT_TASK_AWAITING_REVIEW=Task waiting for your review
category.default=Notification
