# Notification emails and chat notices (NotificationMessageComposer). UTF-8. Vouvoiement.
# Every key must exist in all six locales with the same {placeholders}: NotificationCatalogParityTest.

format.datetime=dd/MM/yyyy HH:mm

name.untitled=Sans titre
name.billing=Crédits

action.open_run=Ouvrir l'exécution
action.open_workflow=Ouvrir le workflow
action.add_credits=Ajouter des crédits
action.open_app=Ouvrir LiveContext

failure.rationed=Tant qu'il continue d'échouer, vous recevrez au plus un rappel par jour, puis un message dès qu'il s'exécutera de nouveau avec succès.

run_failed.subject=Échec du workflow : {name}
run_failed.line1=Votre workflow de production « {name} » a échoué le {time}.

failing_again.subject=Nouvel échec : {name}
failing_again.line1=« {name} » a de nouveau échoué le {time}, alors qu'il était rétabli.

budget.subject=Workflow arrêté par son plafond de dépenses : {name}
budget.line1=« {name} » a dépensé {spent} crédits sur son plafond de {cap} pour cette période.
budget.line2=Il ne s'exécutera plus avant la réinitialisation de la période ou le relèvement du plafond.

credit_low.subject=Vos crédits LiveContext sont bientôt épuisés
credit_low.line1.one=Il vous reste environ {count} crédit sur ce cycle.
credit_low.line1.other=Il vous reste environ {count} crédits sur ce cycle.
credit_low.line2=Une fois épuisés, les workflows et agents qui consomment des crédits s'arrêtent.

credit_exhausted.subject=Vous n'avez plus de crédits LiveContext
credit_exhausted.line1=Les workflows et agents qui consomment des crédits s'arrêtent.
credit_exhausted.line2=Ajoutez des crédits ou changez d'offre pour les relancer.

reminder.subject=Toujours en échec : {name}
reminder.line1.one=« {name} » a échoué {count} fois de plus depuis le {time}.
reminder.line1.other=« {name} » a échoué {count} fois de plus depuis le {time}.
reminder.line2.one=Premier échec le {time}, {count} échec au total. Prochain rappel dans 24 heures s'il échoue toujours.
reminder.line2.other=Premier échec le {time}, {count} échecs au total. Prochain rappel dans 24 heures s'il échoue toujours.

recovered.subject=Rétabli : {name}
recovered.line1=« {name} » s'est de nouveau exécuté avec succès.
recovered.line2.one=Il avait échoué {count} fois entre le {from} et le {to}.
recovered.line2.other=Il avait échoué {count} fois entre le {from} et le {to}.

digest.subject.one=Votre résumé LiveContext : {count} élément
digest.subject.other=Votre résumé LiveContext : {count} éléments
digest.intro.one={count} point requiert votre attention :
digest.intro.other={count} points requièrent votre attention :
digest.item=- {label} : {name}
digest.more.one=- et {count} autre dans l'application
digest.more.other=- et {count} autres dans l'application

category.RUN_FAILED=Échec du workflow
category.BUDGET_REACHED=Workflow arrêté par son plafond de dépenses
category.CREDIT_LOW=Crédits bientôt épuisés
category.CREDIT_EXHAUSTED=Plus de crédits
category.CRED_EXPIRED=Identifiant expiré
category.WEBHOOK_TRIGGER_DISABLED=Déclencheur désactivé
category.AGENT_TASK_ASSIGNED=Tâche qui vous est assignée
category.AGENT_TASK_MENTION=Vous avez été mentionné dans une tâche
category.AGENT_TASK_AWAITING_REVIEW=Tâche en attente de votre relecture
category.default=Notification
