# Notification emails and chat notices (NotificationMessageComposer). UTF-8.
# Every key must exist in all six locales with the same {placeholders}: NotificationCatalogParityTest.
# Chinese has no grammatical plural: the .one and .other forms are the same sentence.

format.datetime=yyyy年M月d日 HH:mm

name.untitled=未命名
name.billing=积分

action.open_run=打开此次运行
action.open_workflow=打开工作流
action.add_credits=添加积分
action.open_app=打开 LiveContext

failure.rationed=在它持续失败期间，您每天最多会收到一次提醒，并在它再次成功运行时收到一条消息。

run_failed.subject=工作流失败：{name}
run_failed.line1=您的生产工作流“{name}”于 {time} 运行失败。

failing_again.subject=再次失败：{name}
failing_again.line1=“{name}”在恢复后于 {time} 再次失败。

budget.subject=工作流因达到支出上限而停止：{name}
budget.line1=“{name}”在本周期已消耗 {spent} 积分，上限为 {cap} 积分。
budget.line2=在周期重置或上限提高之前，它不会再次运行。

credit_low.subject=您的 LiveContext 积分即将用完
credit_low.line1.one=本周期大约还剩 {count} 积分。
credit_low.line1.other=本周期大约还剩 {count} 积分。
credit_low.line2=积分用完后，使用积分的工作流和智能体将停止运行。

credit_exhausted.subject=您的 LiveContext 积分已用完
credit_exhausted.line1=使用积分的工作流和智能体正在停止运行。
credit_exhausted.line2=请添加积分或更换套餐以恢复运行。

reminder.subject=仍在失败：{name}
reminder.line1.one=自 {time} 以来，“{name}”又失败了 {count} 次。
reminder.line1.other=自 {time} 以来，“{name}”又失败了 {count} 次。
reminder.line2.one=首次失败于 {time}，共失败 {count} 次。如果仍在失败，将在 24 小时后再次提醒。
reminder.line2.other=首次失败于 {time}，共失败 {count} 次。如果仍在失败，将在 24 小时后再次提醒。

recovered.subject=已恢复：{name}
recovered.line1=“{name}”已再次成功运行。
recovered.line2.one=它在 {from} 至 {to} 期间失败了 {count} 次。
recovered.line2.other=它在 {from} 至 {to} 期间失败了 {count} 次。

digest.subject.one=您的 LiveContext 摘要：{count} 项
digest.subject.other=您的 LiveContext 摘要：{count} 项
digest.intro.one=有 {count} 项需要您关注：
digest.intro.other=有 {count} 项需要您关注：
digest.item=- {label}：{name}
digest.more.one=- 应用中还有 {count} 项
digest.more.other=- 应用中还有 {count} 项

category.RUN_FAILED=工作流失败
category.BUDGET_REACHED=工作流因达到支出上限而停止
category.CREDIT_LOW=积分即将用完
category.CREDIT_EXHAUSTED=积分已用完
category.CRED_EXPIRED=凭据已过期
category.WEBHOOK_TRIGGER_DISABLED=触发器已关闭
category.AGENT_TASK_ASSIGNED=分配给您的任务
category.AGENT_TASK_MENTION=您在任务中被提及
category.AGENT_TASK_AWAITING_REVIEW=任务等待您审核
category.default=通知
