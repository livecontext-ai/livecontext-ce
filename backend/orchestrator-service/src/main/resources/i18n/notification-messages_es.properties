# Notification emails and chat notices (NotificationMessageComposer). UTF-8. Usted.
# Every key must exist in all six locales with the same {placeholders}: NotificationCatalogParityTest.

format.datetime=dd/MM/yyyy HH:mm

name.untitled=Sin título
name.billing=Créditos

action.open_run=Abrir la ejecución
action.open_workflow=Abrir el workflow
action.add_credits=Añadir créditos
action.open_app=Abrir LiveContext

failure.rationed=Mientras siga fallando, recibirá como máximo un recordatorio al día y un mensaje cuando vuelva a ejecutarse correctamente.

run_failed.subject=Workflow fallido: {name}
run_failed.line1=Su workflow de producción «{name}» falló el {time}.

failing_again.subject=Vuelve a fallar: {name}
failing_again.line1=«{name}» volvió a fallar el {time}, después de haberse recuperado.

budget.subject=Workflow detenido por su límite de gasto: {name}
budget.line1=«{name}» gastó {spent} de sus {cap} créditos de límite para este periodo.
budget.line2=No volverá a ejecutarse hasta que se reinicie el periodo o se aumente el límite.

credit_low.subject=Sus créditos de LiveContext se están agotando
credit_low.line1.one=Queda aproximadamente {count} crédito en este ciclo.
credit_low.line1.other=Quedan aproximadamente {count} créditos en este ciclo.
credit_low.line2=Cuando se agoten, los workflows y agentes que consumen créditos se detendrán.

credit_exhausted.subject=Se ha quedado sin créditos de LiveContext
credit_exhausted.line1=Los workflows y agentes que consumen créditos se están deteniendo.
credit_exhausted.line2=Añada créditos o cambie de plan para reanudarlos.

reminder.subject=Sigue fallando: {name}
reminder.line1.one=«{name}» falló {count} vez más desde el {time}.
reminder.line1.other=«{name}» falló {count} veces más desde el {time}.
reminder.line2.one=Falló por primera vez el {time}, {count} fallo en total. Próximo recordatorio en 24 horas si sigue fallando.
reminder.line2.other=Falló por primera vez el {time}, {count} fallos en total. Próximo recordatorio en 24 horas si sigue fallando.

recovered.subject=Recuperado: {name}
recovered.line1=«{name}» volvió a ejecutarse correctamente.
recovered.line2.one=Había fallado {count} vez entre el {from} y el {to}.
recovered.line2.other=Había fallado {count} veces entre el {from} y el {to}.

digest.subject.one=Su resumen de LiveContext: {count} elemento
digest.subject.other=Su resumen de LiveContext: {count} elementos
digest.intro.one={count} asunto requiere su atención:
digest.intro.other={count} asuntos requieren su atención:
digest.item=- {label}: {name}
digest.more.one=- y {count} más en la aplicación
digest.more.other=- y {count} más en la aplicación

category.RUN_FAILED=Workflow fallido
category.BUDGET_REACHED=Workflow detenido por su límite de gasto
category.CREDIT_LOW=Créditos casi agotados
category.CREDIT_EXHAUSTED=Sin créditos
category.CRED_EXPIRED=Credencial caducada
category.WEBHOOK_TRIGGER_DISABLED=Disparador desactivado
category.AGENT_TASK_ASSIGNED=Tarea asignada a usted
category.AGENT_TASK_MENTION=Le mencionaron en una tarea
category.AGENT_TASK_AWAITING_REVIEW=Tarea pendiente de su revisión
category.default=Notificación
