# Notification emails and chat notices (NotificationMessageComposer). UTF-8. Sie-Form.
# Every key must exist in all six locales with the same {placeholders}: NotificationCatalogParityTest.

format.datetime=dd.MM.yyyy HH:mm

name.untitled=Ohne Titel
name.billing=Credits

action.open_run=Ausführung öffnen
action.open_workflow=Workflow öffnen
action.add_credits=Credits hinzufügen
action.open_app=LiveContext öffnen

failure.rationed=Solange er weiter fehlschlägt, erhalten Sie höchstens eine Erinnerung pro Tag und eine Nachricht, sobald er wieder erfolgreich läuft.

run_failed.subject=Workflow fehlgeschlagen: {name}
run_failed.line1=Ihr Produktions-Workflow „{name}“ ist am {time} fehlgeschlagen.

failing_again.subject=Erneut fehlgeschlagen: {name}
failing_again.line1=„{name}“ ist am {time} erneut fehlgeschlagen, nachdem er sich erholt hatte.

budget.subject=Workflow an seinem Ausgabenlimit gestoppt: {name}
budget.line1=„{name}“ hat {spent} von {cap} Credits seines Limits für diesen Zeitraum verbraucht.
budget.line2=Er läuft erst wieder, wenn der Zeitraum zurückgesetzt oder das Limit erhöht wird.

credit_low.subject=Ihre LiveContext-Credits gehen zur Neige
credit_low.line1.one=In diesem Zyklus ist noch etwa {count} Credit übrig.
credit_low.line1.other=In diesem Zyklus sind noch etwa {count} Credits übrig.
credit_low.line2=Sind sie aufgebraucht, stoppen Workflows und Agenten, die Credits verbrauchen.

credit_exhausted.subject=Ihre LiveContext-Credits sind aufgebraucht
credit_exhausted.line1=Workflows und Agenten, die Credits verbrauchen, werden gestoppt.
credit_exhausted.line2=Fügen Sie Credits hinzu oder wechseln Sie den Tarif, um sie fortzusetzen.

reminder.subject=Weiterhin fehlerhaft: {name}
reminder.line1.one=„{name}“ ist seit dem {time} noch {count} weiteres Mal fehlgeschlagen.
reminder.line1.other=„{name}“ ist seit dem {time} noch {count} weitere Male fehlgeschlagen.
reminder.line2.one=Der erste Fehler trat am {time} auf, insgesamt {count} Fehler. Nächste Erinnerung in 24 Stunden, falls er weiterhin fehlschlägt.
reminder.line2.other=Der erste Fehler trat am {time} auf, insgesamt {count} Fehler. Nächste Erinnerung in 24 Stunden, falls er weiterhin fehlschlägt.

recovered.subject=Wieder in Ordnung: {name}
recovered.line1=„{name}“ ist wieder erfolgreich gelaufen.
recovered.line2.one=Er war zwischen {from} und {to} {count} Mal fehlgeschlagen.
recovered.line2.other=Er war zwischen {from} und {to} {count} Mal fehlgeschlagen.

digest.subject.one=Ihre LiveContext-Zusammenfassung: {count} Eintrag
digest.subject.other=Ihre LiveContext-Zusammenfassung: {count} Einträge
digest.intro.one={count} Punkt erfordert Ihre Aufmerksamkeit:
digest.intro.other={count} Punkte erfordern Ihre Aufmerksamkeit:
digest.item=- {label}: {name}
digest.more.one=- und {count} weiterer in der App
digest.more.other=- und {count} weitere in der App

