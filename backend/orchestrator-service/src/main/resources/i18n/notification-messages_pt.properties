# Notification emails and chat notices (NotificationMessageComposer). UTF-8.
# Every key must exist in all six locales with the same {placeholders}: NotificationCatalogParityTest.

format.datetime=dd/MM/yyyy HH:mm

name.untitled=Sem título
name.billing=Créditos

action.open_run=Abrir a execução
action.open_workflow=Abrir o workflow
action.add_credits=Adicionar créditos
action.open_app=Abrir o LiveContext

failure.rationed=Enquanto continuar falhando, você receberá no máximo um lembrete por dia e uma mensagem quando ele voltar a ser executado com sucesso.

run_failed.subject=Falha no workflow: {name}
run_failed.line1=Seu workflow de produção “{name}” falhou em {time}.

failing_again.subject=Falhando novamente: {name}
failing_again.line1=“{name}” falhou novamente em {time}, depois de ter se recuperado.

budget.subject=Workflow parado pelo limite de gastos: {name}
budget.line1=“{name}” gastou {spent} dos {cap} créditos do seu limite para este período.
budget.line2=Ele não será executado novamente até o período reiniciar ou o limite ser aumentado.

credit_low.subject=Seus créditos do LiveContext estão acabando
credit_low.line1.one=Resta cerca de {count} crédito neste ciclo.
credit_low.line1.other=Restam cerca de {count} créditos neste ciclo.
credit_low.line2=Quando acabarem, os workflows e agentes que usam créditos param.

credit_exhausted.subject=Seus créditos do LiveContext acabaram
credit_exhausted.line1=Os workflows e agentes que usam créditos estão parando.
credit_exhausted.line2=Adicione créditos ou mude de plano para retomá-los.

reminder.subject=Ainda falhando: {name}
reminder.line1.one=“{name}” falhou mais {count} vez desde {time}.
reminder.line1.other=“{name}” falhou mais {count} vezes desde {time}.
reminder.line2.one=A primeira falha foi em {time}, {count} falha no total. Próximo lembrete em 24 horas se continuar falhando.
reminder.line2.other=A primeira falha foi em {time}, {count} falhas no total. Próximo lembrete em 24 horas se continuar falhando.

recovered.subject=Recuperado: {name}
recovered.line1=“{name}” voltou a ser executado com sucesso.
recovered.line2.one=Ele havia falhado {count} vez entre {from} e {to}.
recovered.line2.other=Ele havia falhado {count} vezes entre {from} e {to}.

digest.subject.one=Seu resumo do LiveContext: {count} item
digest.subject.other=Seu resumo do LiveContext: {count} itens
digest.intro.one={count} item precisa da sua atenção:
digest.intro.other={count} itens precisam da sua atenção:
digest.item=- {label}: {name}
digest.more.one=- e mais {count} no aplicativo
digest.more.other=- e mais {count} no aplicativo

category.RUN_FAILED=Falha no workflow
category.BUDGET_REACHED=Workflow parado pelo limite de gastos
category.CREDIT_LOW=Créditos acabando
category.CREDIT_EXHAUSTED=Sem créditos
category.CRED_EXPIRED=Credencial expirada
category.WEBHOOK_TRIGGER_DISABLED=Gatilho desativado
category.AGENT_TASK_ASSIGNED=Tarefa atribuída a você
category.AGENT_TASK_MENTION=Você foi mencionado em uma tarefa
category.AGENT_TASK_AWAITING_REVIEW=Tarefa aguardando sua revisão
category.default=Notificação
