# Cap on the Spring TestContext cache in this module's test JVM (default 32).
# CI runs the whole module in one fork whose heap is ~875 MiB (25% of the runner's 3.5Gi), and
# every cached ApplicationContext stays live: on 2026-10-01 main peaked at 95% of the heap after
# ~24 contexts and a branch adding a few beans hit 99.8%, OutOfMemoryError, then the job timeout.
# Past this cap the least recently used context is closed; one needed again is rebuilt.
spring.test.context.cache.maxSize=8
