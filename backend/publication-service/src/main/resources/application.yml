server:
  port: 8092

spring:
  application:
    name: publication-service
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:apimarketplace}?currentSchema=publication
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 20000
      idle-timeout: 300000
      max-lifetime: 600000
  jpa:
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        default_schema: publication
        jdbc:
          time_zone: UTC
  flyway:
    enabled: false
  jackson:
    time-zone: UTC
    serialization:
      write-dates-as-timestamps: false

gateway:
  filter:
    secret-key: ${GATEWAY_SECRET_KEY:}
    verification-enabled: ${GATEWAY_VERIFICATION_ENABLED:true}
    public-paths:
      - /health
      - /actuator
      - /api/internal/
      - /api/public/

# Cloud-only feature: admin-curated marketplace highlights. CE distributions
# leave this unset (or false) -> the admin controller bean is not loaded
# (404 on /api/publications/admin/highlights/**) and the public read endpoint
# returns an empty array (the table stays empty since no admin can write).
marketplace:
  curation:
    admin-enabled: ${MARKETPLACE_CURATION_ADMIN_ENABLED:false}
  # Cloud-side CE marketplace endpoints (/api/ce-marketplace/**, CeDownloadController):
  # free-snapshot download + acquire-with-auth paid purchase billed as
  # MARKETPLACE_PURCHASE on the linked cloud account. Cloud is the implicit
  # default profile -> ON by default here. CE monoliths run marketplace.mode=remote
  # and CONSUME these endpoints from the cloud - they must not serve them
  # (application-ce.yml pins this to false).
  ce-download:
    enabled: ${MARKETPLACE_CE_DOWNLOAD_ENABLED:true}

# Plan-based resource limits (publication/shared-link quotas per plan). Kill-switch:
# false = NO quota enforcement (CE sets it false in application-ce.yml). MUST stay
# true in cloud prod; pinned in values-prod.yaml (services.publication.env). See the project docs.
plan-limits:
  enabled: ${PLAN_LIMITS_ENABLED:true}

services:
  orchestrator-url: ${ORCHESTRATOR_SERVICE_URL:http://localhost:8099}
  agent-url: ${AGENT_SERVICE_URL:http://localhost:8090}
  interface-url: ${INTERFACE_SERVICE_URL:http://localhost:8089}
  datasource-url: ${DATASOURCE_SERVICE_URL:http://localhost:8088}
  storage-url: ${STORAGE_SERVICE_URL:http://localhost:8082}
  auth-service:
    url: ${AUTH_SERVICE_URL:http://localhost:8083}

# Marketplace showcase file proxy signing. Shared HMAC secret with storage-service.
# Same env var on both services - drift would silently break every marketplace card.
storage:
  showcase:
    hmac-secret: ${STORAGE_SHOWCASE_HMAC_SECRET:}

logging:
  file:
    name: logs/publication-service.log

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      show-details: always
  # Latency buckets for http.server.requests. Without them the service emits only
  # a count and a sum, so it is invisible to the HighApiLatency SLO in
  # deploy/config/alert-rules.yml, which reads the le="5.0" bucket. Six of the
  # twelve services had no buckets at all, so a latency regression on this one
  # could not have alerted.
  #
  # `slo` WITHOUT `percentiles-histogram`, unlike the five services instrumented
  # earlier. `percentiles-histogram: true` emits Micrometer's full ladder, measured
  # at 74 buckets per timer on this deployment; these five jobs carried ~170 timers
  # between them when measured 2026-09-01, and that count grows with every new endpoint,
  # so the ladder would add on the order of 12,000 series. The monitoring box
  # (ops-host) runs prometheus with about 1 GiB of the 7 GiB free and already alerts
  # on HighMemoryUsage, so that is a real cost for data nothing reads: the alert
  # rule needs exactly one boundary. The SLO boundaries alone give 6 bucket series per
  # timer (the 5 declared, plus +Inf), so on the order of 1,000, and the same le="5.0".
  #
  # Only the SLO reads these. The Grafana overview's p95/p99 panels are restricted
  # to the five jobs that carry the full ladder, because histogram_quantile over
  # five boundaries returns the highest finite bound and would render a confident
  # flat line at exactly 5s for a job whose real p99 is minutes.
  #
  # Pinned by gateway/.../ApiLatencySloContractTest.
  metrics:
    distribution:
      slo:
        http.server.requests: 100ms, 500ms, 1s, 3s, 5s

# Token-at-rest material (share/link tokens are AES-encrypted + HMAC-hashed in the DB).
# Same variables as every other service; outside Kubernetes a blank value falls back to
# ephemeral in-memory material (dev only), inside Kubernetes a blank value refuses to boot.
credential:
  encryption:
    password: ${CREDENTIAL_ENCRYPTION_PASSWORD:}
    salt: ${CREDENTIAL_ENCRYPTION_SALT:}
