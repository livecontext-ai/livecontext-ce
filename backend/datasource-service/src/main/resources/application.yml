server:
  port: 8088

spring:
  application:
    name: datasource-service
  datasource:
    url: jdbc:postgresql://localhost:5432/apimarketplace?currentSchema=datasource
    username: postgres
    password: postgres
    hikari:
      maximum-pool-size: 30
      minimum-idle: 5
      connection-timeout: 20000
      idle-timeout: 300000
      max-lifetime: 600000
  jpa:
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        default_schema: datasource
        jdbc:
          time_zone: UTC
  flyway:
    enabled: false
  jackson:
    time-zone: UTC
    serialization:
      write-dates-as-timestamps: false

# Gateway authentication
gateway:
  filter:
    secret-key: ${GATEWAY_SECRET_KEY:}
    verification-enabled: ${GATEWAY_VERIFICATION_ENABLED:true}
    public-paths:
      - /health
      - /actuator
      - /api/internal/
      - /api/agent-tools

# The product-film library behind the public /videos pages.
#
# BLANK by default, and that is the correct value everywhere except the LiveContext
# cloud: an unset id means the public endpoint serves an empty library instead of
# guessing at a table. Setting it opts ONE data source, owned by ONE tenant, into
# being readable anonymously - see PublicVideoService for why that is the whole
# security argument.
public:
  video-library:
    datasource-id: ${PUBLIC_VIDEO_LIBRARY_DATASOURCE_ID:}
    tenant-id: ${PUBLIC_VIDEO_LIBRARY_TENANT_ID:}

# Credential encryption (same keys as orchestrator for decryption compatibility)
credential:
  encryption:
    password: ${CREDENTIAL_ENCRYPTION_PASSWORD:}
    salt: ${CREDENTIAL_ENCRYPTION_SALT:}

services:
  # services.orchestrator-url removed 2026-05-08 - fed the deleted ActivityLogClient
  # cross-service callback. No remaining consumer in datasource-service.
  auth-service:
    url: ${AUTH_SERVICE_URL:http://localhost:8083}

# Storage tracking
storage:
  s3:
    enabled: ${S3_ENABLED:false}

# Agent guard defaults - datasource-service reads the unified per-resource cap (V100).
# Mirrors the same prefix used by agent-service / conversation-service / interface-service.
ai:
  agent:
    defaults:
      max-per-resource-per-turn: 5   # Uniform cap on table(action='create') per turn; resolved via caller-agent credential

# Actuator health endpoint
management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      show-details: always
  # Latency buckets for http.server.requests. Without them the service emits only
  # a count and a sum, so it is invisible to the HighApiLatency SLO in
  # deploy/config/alert-rules.yml, which reads the le="5.0" bucket. Six of the
  # twelve services had no buckets at all, so a latency regression on this one
  # could not have alerted.
  #
  # `slo` WITHOUT `percentiles-histogram`, unlike the five services instrumented
  # earlier. `percentiles-histogram: true` emits Micrometer's full ladder, measured
  # at 74 buckets per timer on this deployment; these five jobs carried ~170 timers
  # between them when measured 2026-09-01, and that count grows with every new endpoint,
  # so the ladder would add on the order of 12,000 series. The monitoring box
  # (ops-host) runs prometheus with about 1 GiB of the 7 GiB free and already alerts
  # on HighMemoryUsage, so that is a real cost for data nothing reads: the alert
  # rule needs exactly one boundary. The SLO boundaries alone give 6 bucket series per
  # timer (the 5 declared, plus +Inf), so on the order of 1,000, and the same le="5.0".
  #
  # Only the SLO reads these. The Grafana overview's p95/p99 panels are restricted
  # to the five jobs that carry the full ladder, because histogram_quantile over
  # five boundaries returns the highest finite bound and would render a confident
  # flat line at exactly 5s for a job whose real p99 is minutes.
  #
  # Pinned by gateway/.../ApiLatencySloContractTest.
  metrics:
    distribution:
      slo:
        http.server.requests: 100ms, 500ms, 1s, 3s, 5s

logging:
  level:
    com.apimarketplace.datasource: INFO
  file:
    name: logs/datasource-service.log
