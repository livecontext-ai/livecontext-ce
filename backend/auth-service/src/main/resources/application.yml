# PostHog server-side product analytics. OFF by default (CE / local / unconfigured
# emit nothing); cloud prod turns it on through the same POSTHOG_* env the other
# services read. EU host for GDPR.
posthog:
  enabled: ${POSTHOG_ENABLED:false}
  api-key: ${POSTHOG_API_KEY:}
  host: ${POSTHOG_HOST:https://eu.i.posthog.com}

# Cloud lifecycle emails (Resend contacts + events feeding Resend Automations). OFF by
# default: inert unless enabled=true AND an api key is set, which only cloud prod does
# (LIFECYCLE_RESEND_API_KEY comes from the k8s secret). The CE monolith never sets them.
lifecycle:
  resend:
    enabled: ${LIFECYCLE_RESEND_ENABLED:false}
    api-key: ${LIFECYCLE_RESEND_API_KEY:}
    base-url: ${LIFECYCLE_RESEND_BASE_URL:https://api.resend.com}
  # 12-month retention of auth.users.signup_ip (abuse prevention only). Both editions.
  signup-ip:
    purge-cron: ${LIFECYCLE_SIGNUP_IP_PURGE_CRON:0 30 3 * * *}

# Service CLOUD UNIQUEMENT. Le monolith CE charge ce JAR via dépendance Maven; les beans KC restent
# inactifs en CE via @ConditionalOnProperty(auth.mode=keycloak, matchIfMissing=false).
# Voir CLAUDE.md section "Règle architecturale CE / Cloud".
server:
  port: 8083


# Audit subsystem (Phase 2)
# - hmac-key: base64-encoded 32+ byte secret used to sign each audit event
# - ua-pepper: base64-encoded 32+ byte secret used to fingerprint user agents
# Both MUST be set in production via env vars AUDIT_HMAC_KEY and AUDIT_UA_PEPPER.
audit:
  hmac-key: ${AUDIT_HMAC_KEY:}
  ua-pepper: ${AUDIT_UA_PEPPER:}

spring:
  application:
    name: auth-service
  
  datasource:
    url: jdbc:postgresql://localhost:5432/apimarketplace?currentSchema=auth
    username: postgres
    password: postgres
    driver-class-name: org.postgresql.Driver
    hikari:
      # Connection pool settings
      maximum-pool-size: 20
      minimum-idle: 5
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1200000  # 20 minutes (shorter than default 30min)
      leak-detection-threshold: 60000
      
      # Connection validation
      connection-test-query: SELECT 1
      validation-timeout: 5000
      
      # PostgreSQL specific settings
      data-source-properties:
        socketTimeout: 30
        loginTimeout: 10
        connectTimeout: 10
        tcpKeepAlive: true
        applicationName: auth-service
  
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
        default_schema: auth
        jdbc:
          time_zone: UTC

  jackson:
    time-zone: UTC
    serialization:
      write-dates-as-timestamps: false

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

  mail:
    host: ${SMTP_HOST:localhost}
    port: ${SMTP_PORT:1025}
    username: ${SMTP_USER:}
    password: ${SMTP_PASSWORD:}
    properties:
      # Security defaults flipped to true (S-3). MailTransportSecurityValidator
      # fail-fasts at boot if SMTP_STARTTLS=false against a non-local host -
      # local dev (Mailhog on localhost:1025) keeps working by host-allowlist.
      mail.smtp.auth: ${SMTP_AUTH:true}
      mail.smtp.starttls.enable: ${SMTP_STARTTLS:true}
      # JavaMail defaults ALL THREE of these to infinite. Verification codes and
      # invitations are sent ON the request thread, so an SMTP host that accepts
      # the TCP connection and then never answers pins one request thread per
      # call, with nothing to release it, until the pool is exhausted and the
      # service is down. Password reset mail is the one path that is detached
      # (see PasswordResetMailer), where the same host instead fills a bounded
      # queue and the mails are dropped. Both need a bound.
      mail.smtp.connectiontimeout: ${SMTP_CONNECT_TIMEOUT_MS:10000}
      mail.smtp.timeout: ${SMTP_READ_TIMEOUT_MS:10000}
      mail.smtp.writetimeout: ${SMTP_WRITE_TIMEOUT_MS:10000}

  flyway:
    enabled: false
  
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${KEYCLOAK_ISSUER_URI:http://localhost:8180/realms/livecontext}

# Configuration Keycloak
app:
  mail:
    from: ${SMTP_FROM:noreply@livecontext.ai}
    from-name: LiveContext
  security:
    keycloak:
      audience: ${KEYCLOAK_AUDIENCE:livecontext-frontend}

gateway:
  filter:
    secret-key: ${GATEWAY_SECRET_KEY:}
    verification-enabled: ${GATEWAY_VERIFICATION_ENABLED:true}
    public-paths:
      - /actuator/
      - /api/internal/
      - /api/users/health
      - /api/auth/health
      - /public/
      - /webhooks/
      - /.well-known/
      - /v1/authorize
      - /api/billing/plans
      - /api/billing/checkout/finalize
      - /api/billing/checkout/success
      - /api/credits/
      - /api/credentials/oauth2/callback
      - /api/contact
      - /api/auth/register
      - /api/auth/login
      - /api/auth/refresh
      - /api/auth/logout
      - /api/auth/openid-configuration
    hmac-required-paths:
      - /api/credits/
      # CRED-1 DONE (2026-09-18). This used to name six individual credential paths, leaving the
      # lookup resolvers (/all, /default, /{id}, /scopes) ungated even though they return DECRYPTED
      # Credential objects. The note here said widening to the whole prefix was the right end-state
      # but had to wait for two in-cluster callers to sign; both now do
      # (ConversationToolExecutionService signs in internalHeaders, and its /default call no longer
      # bypasses that helper; ApiMigrationImporter signs the pricing-versions/bootstrap call), so
      # the prefix is gated as a whole and a new endpoint added under it is gated by default
      # instead of by remembering to list it.
      - /api/internal/credentials/
      - /api/internal/auth/workspace/

oauth2:
  callback-url: ${OAUTH2_CALLBACK_URL:http://localhost:8083/api/credentials/oauth2/callback}
  frontend-url: ${OAUTH2_FRONTEND_URL:http://localhost:3000}

services:
  auth-service:
    url: ${AUTH_SERVICE_URL:http://localhost:8083}
  catalog-url: ${CATALOG_SERVICE_URL:http://localhost:8081}
  # PR1: GatewayCacheClient calls /api/gateway/cache/invalidate/{providerId}
  # on the gateway after a set-default flip to bust the 5-min QuotaCacheService
  # entry (otherwise users see stale active-org for up to 5 minutes).
  gateway-url: ${GATEWAY_URL:http://localhost:8080}

keycloak:
  issuer-uri: ${KEYCLOAK_ISSUER_URI:http://localhost:8180/realms/livecontext}
  audience: ${KEYCLOAK_AUDIENCE:livecontext-frontend}
  admin:
    server-url: ${KEYCLOAK_ADMIN_URL:http://localhost:8180}
    realm: ${KEYCLOAK_REALM:livecontext}
    username: ${KEYCLOAK_ADMIN_USERNAME:admin}
    password: ${KEYCLOAK_ADMIN_PASSWORD:admin}
    # cloud-link Phase 1 - service-account client created by configure-keycloak.sh §4b.
    # KcAdminLogoutService uses these for client_credentials grant to call /users/{id}/logout
    # after a ce_link revoke. Deploy mounts the secret via KC_ADMIN_CLIENT_SECRET (Doppler/Vault).
    client-id: ${KC_ADMIN_CLIENT_ID:livecontext-admin-api}
    client-secret: ${KC_ADMIN_CLIENT_SECRET:}

# Credential encryption (AES-256)
credential:
  encryption:
    password: ${CREDENTIAL_ENCRYPTION_PASSWORD:}
    salt: ${CREDENTIAL_ENCRYPTION_SALT:}

# Platform credential/API-tool markup (third-party tool-call accounting) + credit
# metering kill-switch. Defaults equal the historical CreditService constants; the
# PROD-effective values are pinned in deploy/helm/livecontext/values-prod.yaml
# (services.auth.env). credit.unlimited MUST stay false in cloud prod (true =
# consumption tracked but balance infinite = NO billing). See the project docs.
credentials:
  platform:
    markup:
      enabled: ${CREDENTIALS_PLATFORM_MARKUP_ENABLED:true}
      shadow: ${CREDENTIALS_PLATFORM_MARKUP_SHADOW:false}
credit:
  unlimited: ${CREDIT_UNLIMITED:false}

# Configuration de facturation
billing:
  provider: stripe
  # --- Unit-economics levers: internal pricing configuration ---
  # 1 credit = $0.001 of provider LIST price; every LLM call is billed
  # providerCost × llm.cloud-multiplier, and cloud-multiplier is the ONLY margin.
  # cloud-multiplier moved 1.8 -> 1.11 on 2026-09-03 (deliberate margin cut),
  # 1.11 -> 2.0 on 2026-09-16 (50% gross margin per request) and 2.0 -> 1.333333 on
  # 2026-09-17 (25% gross margin per request).
  #
  # The 2026-09-17 cut did NOT re-scale the cost profiles, unlike the 2026-09-16 rise
  # which shrank the unit so the published price stayed put. The point of a cut is that
  # a user pays less, so every published figure fell with it by the exact factor
  # 1.333333/2.0 - see frontend/lib/billing/pricing-constants.ts, whose published
  # figures are re-priced in the same commit and pinned to this value by
  # frontend/lib/billing/__tests__/margin-repricing.test.ts. Since 2026-09-21 those
  # figures are priced on a LIGHTWEIGHT model (a named DeepSeek Flash catalogue row)
  # rather than on Claude Sonnet 5, so a credit figure quoted there is no longer
  # comparable with one quoted here without converting for the model.
  #
  # The five cache multipliers are a FALLBACK since V491, not the tariff. A cached token
  # is priced at the MODEL's own rate (auth.model_pricing.cache_read_rate /
  # cache_write_rate, mirrored from the catalog feed); these weights apply only to a model
  # whose cache price is unknown. Most catalog models now carry one, so changing a value
  # here moves the bill for the REMAINDER only - re-price the model, not the family.
  #
  # PROD-effective values pinned in values-prod.yaml (services.auth.env) so margin is
  # declared & diff-tracked. See the project docs.
  llm:
    cloud-multiplier: ${BILLING_LLM_CLOUD_MULTIPLIER:1.333333}
    anthropic-cache-write-multiplier: ${BILLING_LLM_ANTHROPIC_CACHE_WRITE_MULTIPLIER:1.25}
    anthropic-cache-read-multiplier: ${BILLING_LLM_ANTHROPIC_CACHE_READ_MULTIPLIER:0.1}
    openai-cached-multiplier: ${BILLING_LLM_OPENAI_CACHED_MULTIPLIER:0.5}
    gemini-cached-multiplier: ${BILLING_LLM_GEMINI_CACHED_MULTIPLIER:0.25}
    deepseek-cached-multiplier: ${BILLING_LLM_DEEPSEEK_CACHED_MULTIPLIER:0.1}
    # Per-provider override of cloud-multiplier, spelled provider=multiplier,provider=...
    # EMPTY AS SHIPPED: every provider bills at the global lever, the decision provider
    # (TypeSafe Jev) included, so the platform has ONE margin and one number to move.
    #
    # WHY THE MECHANISM EXISTS, and why it is not used. cloud-multiplier is a PERCENTAGE,
    # and a percentage of a provider cost that collapsed by an order of magnitude is a
    # margin that rounds to nothing: Jev prices input at $0.042/1M against Claude Sonnet
    # 5's $2.00 and bills no output at all, so the classification that costs 2.6 credits
    # of provider cost on Claude Sonnet 5 (the 2026-09-03 median, n=2,649) costs about
    # 0.048 credits there, and the global lever earns 0.016 credits on it against 0.87 on
    # the LLM path. That 2.6 is quoted here as the Sonnet-5 measurement it is: do NOT read
    # it off MEASURED_PROVIDER_COST.classifyStep, which is neither the same workload
    # (it carries LlmCostProfile.CLASSIFY_STEP, 1,200/60, against the 1,150/30 measured
    # here) nor the same basis (a lightweight catalogue model since 2026-09-21).
    # It carried typesafe=10 for two days on that argument. The decision since
    # 2026-09-20 is that the same multiplier is what the USER pays: an engine whose whole
    # value is costing almost nothing must not be the one row billed at four times the
    # house rate, so the saving is passed on in full and the margin stays uniform.
    #
    # A malformed or non-positive entry is dropped with a WARN and that provider bills at
    # the global lever - the failure direction is the standard margin, never a free call.
    #
    # The default matches the prod pin exactly (EconomicsConfigPinTest asserts it), so
    # reading either file tells the truth about what is charged. The two disagreeing
    # would mean the two files disagree about a margin, which is the drift that test
    # exists to prevent - empty here therefore requires empty in values-prod.yaml.
    provider-multipliers: ${BILLING_LLM_PROVIDER_MULTIPLIERS:}
  websearch:
    credits-per-search: ${BILLING_WEBSEARCH_CREDITS_PER_SEARCH:1}
    credits-per-fetch: ${BILLING_WEBSEARCH_CREDITS_PER_FETCH:1}
  # Flat platform fee for ONE agent turn that ran on the tenant's OWN provider key (their
  # provider bills them the tokens). Keyed on the model's price band (output USD/1M:
  # budget <1.50, mid <5, high <15, top >=15; unknown = no pricing row).
  # The debit is min(this fee, what the platform route would have billed), so a turn shorter
  # than its own fee can never cost more for bringing your own key; these numbers therefore
  # price the AVERAGE turn of the band, not a floor. Calibrated 2026-09-18 on 414 real agent
  # turns against cloud-multiplier 1.333333 (median real cost: 7.7 / 8.7 / 95 / 391 credits).
  # MOVING cloud-multiplier ABOVE RE-OPENS THESE NUMBERS: re-run scripts/billing/byok-fee-calibration.sql
  # before changing either. PROD values pinned in values-prod.yaml.
  own-key:
    credits-per-turn:
      budget: ${BILLING_OWNKEY_CREDITS_BUDGET:1}
      mid: ${BILLING_OWNKEY_CREDITS_MID:2}
      high: ${BILLING_OWNKEY_CREDITS_HIGH:5}
      top: ${BILLING_OWNKEY_CREDITS_TOP:10}
      unknown: ${BILLING_OWNKEY_CREDITS_UNKNOWN:2}
  stripe:
    secretKey: ${STRIPE_SECRET_KEY}
    webhookSecret: ${STRIPE_WEBHOOK_SECRET}
    # Fall back to APP_PUBLIC_URL (the value the k3s helm chart already injects for every
    # public link, e.g. https://livecontext.ai) when STRIPE_SUCCESS_URL/STRIPE_CANCEL_URL
    # are not set explicitly - otherwise prod checkout redirects leak http://localhost:3000.
    # Mirrors the orchestrator.{chat,form}-endpoint.base-url pattern in trigger-service.
    successUrl: ${STRIPE_SUCCESS_URL:${APP_PUBLIC_URL:http://localhost:3000}/app/settings/pricing?checkout=success}
    cancelUrl: ${STRIPE_CANCEL_URL:${APP_PUBLIC_URL:http://localhost:3000}/app/settings/pricing?checkout=cancelled}
    currency: usd
    prices:
      FREE: ${STRIPE_FREE_PRICE_ID:price_free}
      STARTER: ${STRIPE_STARTER_PRICE_ID:price_starter}
      PRO: ${STRIPE_PRO_PRICE_ID:price_pro}
      ENTERPRISE: ${STRIPE_ENTERPRISE_PRICE_ID:price_enterprise}
      PAYG: ${STRIPE_PAYG_PRICE_ID:price_payg}

# Embedded auth (CE mode) - set auth.mode=embedded to enable
auth:
  mode: ${AUTH_MODE:keycloak}
  # Billing nonce (Stripe checkout client_reference_id). The key MUST be shared by every
  # auth replica and survive restarts: unset, NonceUtil generates an ephemeral per-pod key
  # and a webhook landing on the other replica cannot decode the nonce (a PAYG top-up then
  # relies on the Stripe-customer fallback + PaygTopupReconciler). Prod: livecontext-prod-secrets.
  nonce:
    encryption-key: ${NONCE_ENCRYPTION_KEY:}
  jwt:
    issuer: ${AUTH_JWT_ISSUER:livecontext}
    keys-path: ${AUTH_JWT_KEYS_PATH:./data/keys}
  # PR11d-b - per-user cooldown (seconds) between setDefaultOrganization flips.
  # Audit B 2026-05-12 MUST-FIX #2: rapid workspace flips could be scripted to
  # bypass per-member quota caps that are keyed on the default workspace at
  # consume time.
  #
  # Default lowered from 60s → 5s on 2026-05-12 after prod feedback: 60s was
  # audit-defensive but unacceptable UX for a human user switching between
  # their 2 orgs (e.g. personal Free ↔ Team for billing context). 5s still
  # caps scripted abuse at ~12 flips/min (vs 600/min unprotected) - adequate
  # given each flip also triggers a cache fan-out + audit row.
  #
  # Idempotent re-flips to the SAME org are exempt regardless of cooldown.
  organization:
    set-default:
      cooldown-seconds: ${AUTH_ORG_SETDEFAULT_COOLDOWN_SECONDS:5}

jwt:
  secret: ${JWT_SECRET:}
  access-token:
    expiration: ${JWT_ACCESS_TOKEN_EXPIRATION:900000}
  refresh-token:
    expiration: ${JWT_REFRESH_TOKEN_EXPIRATION:2592000000}

# Model pricing seed moved to migration-service (V80 + V112 Flyway migrations).
# ModelCatalogService (agent-service) is the runtime source of truth; any admin
# edits flow through /api/internal/auth/model-pricing/sync - no YAML seeding here.

logging:
  pattern:
    # Carries the level, the thread and the logger, like every other service. The
    # previous "%d - %msg%n" omitted all three, which mattered most here: this is the
    # billing service, so a credit or Stripe failure arrived in the log viewer with no
    # severity at all and could not be told apart from a routine line.
    # console only: this service ships its own logback-spring.xml whose <root> references
    # CONSOLE alone, and its audit appender carries a hardcoded "%msg%n". A file pattern here
    # would be config that looks load-bearing and is not.
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level [%logger{36}] - %msg%n"
  file:
    name: logs/auth-service.log

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: always
  metrics:
    distribution:
      percentiles-histogram:
        http.server.requests: true
      slo:
        http.server.requests: 100ms, 500ms, 1s, 3s, 5s


# Organization invitation rate limits (S-2). Rolling-hour windows on persisted
# invitation rows. Defaults are conservative - bump for high-volume HR/onboarding
# workflows. Override per env via ORG_INVITE_PER_INVITER / ORG_INVITE_PER_ORG.
# Audit trail of rate-limited attempts: see ORG_INVITE_RATE_LIMITED in
# organization_audit_event (queryable via /api/organizations/{id}/audit-log).
org:
  invite:
    rate-limit:
      per-inviter-per-hour: ${ORG_INVITE_PER_INVITER:20}
      per-org-per-hour: ${ORG_INVITE_PER_ORG:50}

# In-app "What's new" announcement. The entry itself ships with the frontend build;
# this switch decides whether the deployment surfaces it at all. Set CHANGELOG_ENABLED=false
# to turn the modal, the sidebar entry and its unread dot off everywhere at once, with no
# rebuild and no redeploy of the frontend - the API then reports the feature as off and the
# client stops announcing. Same key, same effect, in CE (monolith) and in cloud.
changelog:
  enabled: ${CHANGELOG_ENABLED:true}
