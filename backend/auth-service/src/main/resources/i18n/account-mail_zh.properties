# 账户邮件（验证码、组织邀请、停用 / 恢复 / 删除、云端关联恢复）。UTF-8。
# 键的一致性与真实翻译由 AccountMailCatalogTest 保证。*星号*包围的片段在 HTML 中加粗
# （BrandedMail.emphasize）。
common.greeting={name}，您好：
common.greetingNoName=您好：
common.signature=- LiveContext 团队
common.footer=您在 LiveContext 账户所绑定的邮箱地址收到本邮件。

verify.subject=欢迎使用 LiveContext：您的验证码
verify.preheader=您的 LiveContext 验证码
verify.title=欢迎使用 LiveContext
verify.intro=感谢注册。请使用下面的验证码验证您的邮箱地址，完成账户创建。
verify.expiry=验证码将在 {minutes} 分钟后失效。如果这不是您本人操作，可以忽略本邮件。
verify.footer=有人使用该邮箱地址注册了 LiveContext 账户，因此您收到本邮件。

invite.subject=您受邀加入 LiveContext 上的 {org}
invite.preheader=您受邀加入 LiveContext 上的 {org}
invite.title=您收到一份邀请
invite.body=*{inviter}* 邀请您以 *{role}* 的身份加入 LiveContext 上的组织 *{org}*。
invite.action=接受邀请
invite.fallback=如果按钮无法使用，请复制并粘贴此链接：{url}
invite.footer=如果您并未预期收到此邀请，可以忽略本邮件，系统不会创建任何账户。

deactivated.subject=您的 LiveContext 账户已停用
deactivated.title=您的账户已停用
deactivated.body=您的 LiveContext 账户已按您的要求停用。
deactivated.retention=您的数据将保留 {days} 天。之后全部内容将被*永久删除*：工作流、智能体、会话、文件、凭据和发布内容。
deactivated.undo=如果您改变主意，请在 {days} 天内重新登录，我们会为您恢复账户。您也可以通过 {supportEmail} 联系我们。
deactivated.action=重新登录
deactivated.footer=很遗憾您要离开。感谢您使用 LiveContext。

restored.subject=您的 LiveContext 账户已恢复
restored.title=您的账户已恢复
restored.body=您的 LiveContext 账户已恢复，计划中的删除已取消。没有任何内容被删除：工作流、智能体、会话、文件、凭据和发布内容都保持原样。
restored.notyou=如果这不是您本人操作，请立即通过 {supportEmail} 联系我们。
restored.footer=欢迎回来。感谢您使用 LiveContext。

purged.subject=您的 LiveContext 数据已被永久删除
purged.title=您的数据已删除
purged.body=您的 LiveContext 账户 {days} 天的宽限期已结束。
purged.detail=所有内容均已永久删除：工作流及其运行记录、智能体与会话、界面与数据源、文件与已存储对象、API 凭据，以及市场发布内容。
purged.welcome=如果将来您想再次使用 LiveContext，欢迎随时创建新账户。
purged.action=创建新账户
purged.footer=感谢您曾使用 LiveContext。期待再次为您服务。

reset.subject=重置您的 LiveContext 密码
reset.title=重置密码
reset.body=有人请求重置此 LiveContext 账户的密码。
reset.action=设置新密码
reset.expiry=该链接仅可使用一次，并将在 {minutes} 分钟后失效。
reset.fallback=如果按钮无法使用，请复制并粘贴此链接：{url}
reset.ignore=如果这不是您本人的请求，可以忽略本邮件。您的密码没有改变，也没有人获得访问权限。

squat.subject=需要处理：有人尝试关联您的 LiveContext 安装
squat.title=您的云端关联需要处理
squat.body=有人尝试注册一个已经与您的 LiveContext 账户关联的自托管安装。
squat.wasyou=如果这是您本人操作（重新安装、更换设备或使用恢复镜像），则无需处理。
squat.wasnotyou=如果这*不是*您本人操作，请使用下面的链接重置关联，将对方移除。
squat.action=重置云端关联
squat.expiry=该链接将在 {minutes} 分钟后失效，且仅可使用一次。
