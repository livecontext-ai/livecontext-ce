# Konto-E-Mails (Bestätigungscode, Organisationseinladung, Deaktivierung / Wiederherstellung /
# Löschung, Wiederherstellung der Cloud-Verknüpfung). UTF-8. Parität und echte Übersetzungen:
# AccountMailCatalogTest. Ein *markierter* Abschnitt wird im HTML fett (BrandedMail.emphasize).
common.greeting=Hallo {name},
common.greetingNoName=Hallo,
common.signature=- Das LiveContext-Team
common.footer=Sie erhalten diese E-Mail an der Adresse Ihres LiveContext-Kontos.

verify.subject=Willkommen bei LiveContext: Ihr Bestätigungscode
verify.preheader=Ihr LiveContext-Bestätigungscode
verify.title=Willkommen bei LiveContext
verify.intro=Danke für Ihre Registrierung. Bestätigen Sie Ihre E-Mail-Adresse mit dem folgenden Code und schließen Sie die Kontoerstellung ab.
verify.expiry=Dieser Code läuft in {minutes} Minuten ab. Wenn Sie ihn nicht angefordert haben, können Sie diese E-Mail ignorieren.
verify.footer=Sie erhalten diese E-Mail, weil mit dieser Adresse ein LiveContext-Konto erstellt wurde.

invite.subject=Sie wurden eingeladen, {org} auf LiveContext beizutreten
invite.preheader=Sie wurden eingeladen, {org} auf LiveContext beizutreten
invite.title=Sie sind eingeladen
invite.body=*{inviter}* hat Sie eingeladen, der Organisation *{org}* auf LiveContext als *{role}* beizutreten.
invite.action=Einladung annehmen
invite.fallback=Wenn die Schaltfläche nicht funktioniert, kopieren Sie diesen Link: {url}
invite.footer=Wenn Sie diese Einladung nicht erwartet haben, können Sie diese E-Mail ignorieren. Es wird kein Konto erstellt.

deactivated.subject=Ihr LiveContext-Konto wurde deaktiviert
deactivated.title=Ihr Konto wurde deaktiviert
deactivated.body=Ihr LiveContext-Konto wurde wie gewünscht deaktiviert.
deactivated.retention=Ihre Daten werden {days} Tage aufbewahrt. Danach wird alles *endgültig gelöscht*: Workflows, Agenten, Unterhaltungen, Dateien, Zugangsdaten und Veröffentlichungen.
deactivated.undo=Wenn Sie es sich anders überlegen, melden Sie sich innerhalb von {days} Tagen erneut an, und wir bieten Ihnen die Wiederherstellung an. Sie erreichen uns auch unter {supportEmail}.
deactivated.action=Erneut anmelden
deactivated.footer=Schade, dass Sie gehen. Vielen Dank, dass Sie LiveContext genutzt haben.

restored.subject=Ihr LiveContext-Konto wurde wiederhergestellt
restored.title=Ihr Konto wurde wiederhergestellt
restored.body=Ihr LiveContext-Konto wurde wiederhergestellt und die geplante Löschung abgebrochen. Es wurde nichts gelöscht: Workflows, Agenten, Unterhaltungen, Dateien, Zugangsdaten und Veröffentlichungen sind genau so, wie Sie sie verlassen haben.
restored.notyou=Falls Sie das *nicht* waren, kontaktieren Sie uns sofort unter {supportEmail}.
restored.footer=Willkommen zurueck. Vielen Dank, dass Sie LiveContext nutzen.

purged.subject=Ihre LiveContext-Daten wurden endgültig gelöscht
purged.title=Ihre Daten wurden gelöscht
purged.body=Die Kulanzfrist von {days} Tagen für Ihr LiveContext-Konto ist abgelaufen.
purged.detail=Alles wurde endgueltig geloescht: Workflows und ihr Ausfuehrungsverlauf, Agenten und Unterhaltungen, Interfaces und Datenquellen, Dateien und gespeicherte Objekte, API-Zugangsdaten sowie Marketplace-Veroeffentlichungen.
purged.welcome=Wenn Sie LiveContext künftig wieder nutzen möchten, können Sie jederzeit ein neues Konto erstellen.
purged.action=Neues Konto erstellen
purged.footer=Vielen Dank, dass Sie LiveContext genutzt haben. Wir hoffen, Sie wiederzusehen.

reset.subject=Setzen Sie Ihr LiveContext-Passwort zurück
reset.title=Passwort zurücksetzen
reset.body=Für dieses LiveContext-Konto wurde das Zurücksetzen des Passworts angefordert.
reset.action=Neues Passwort wählen
reset.expiry=Der Link ist einmal verwendbar und läuft in {minutes} Minuten ab.
reset.fallback=Wenn die Schaltfläche nicht funktioniert, kopieren Sie diesen Link: {url}
reset.ignore=Wenn Sie das nicht angefordert haben, können Sie diese E-Mail ignorieren. Ihr Passwort wurde nicht geändert und niemand hat Zugriff erhalten.

squat.subject=Handlung erforderlich: Jemand wollte Ihre LiveContext-Installation verknüpfen
squat.title=Handlung für Ihre Cloud-Verknüpfung erforderlich
squat.body=Jemand hat versucht, eine selbst gehostete Installation zu registrieren, die bereits mit Ihrem LiveContext-Konto verknüpft ist.
squat.wasyou=Wenn das Sie waren (Neuinstallation, Rechnerwechsel oder ein Wiederherstellungsabbild), ist nichts zu tun.
squat.wasnotyou=Falls Sie das *nicht* waren, setzen Sie die Verknüpfung über den folgenden Link zurück und schließen Sie die andere Partei aus.
squat.action=Cloud-Verknüpfung zurücksetzen
squat.expiry=Der Link läuft in {minutes} Minuten ab und ist einmal verwendbar.
