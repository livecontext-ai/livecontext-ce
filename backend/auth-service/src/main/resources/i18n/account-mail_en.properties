# Account e-mails (verification code, organization invitation, deactivation / restoration /
# purge, cloud-link recovery). UTF-8. Parity and real translations: AccountMailCatalogTest.
# A *starred* span renders bold in HTML and plain in the text part (BrandedMail.emphasize).
# BODY PARAGRAPHS ONLY. A star anywhere else prints as a literal asterisk in the HTML part; the two
# halves of the mail then disagree for the TITLE only, whose markers the text part strips, while a
# note, a button label and a footer keep the asterisk in both. The title cannot be emphasized in HTML
# because the same value fills the <title> element of the document head, where a tag would show.
common.greeting=Hi {name},
common.greetingNoName=Hi,
common.signature=- The LiveContext Team
common.footer=You are receiving this email at the address on your LiveContext account.

verify.subject=Welcome to LiveContext: your verification code
verify.preheader=Your LiveContext verification code
verify.title=Welcome to LiveContext
verify.intro=Thanks for signing up. Use the code below to verify your email address and finish creating your account.
verify.expiry=This code expires in {minutes} minutes. If you did not request it, you can safely ignore this email.
verify.footer=You are receiving this email because someone signed up for a LiveContext account with this address.

invite.subject=You have been invited to join {org} on LiveContext
invite.preheader=You have been invited to join {org} on LiveContext
invite.title=You are invited
invite.body=*{inviter}* invited you to join the organization *{org}* on LiveContext as *{role}*.
invite.action=Accept invitation
invite.fallback=If the button does not work, copy and paste this link: {url}
invite.footer=If you were not expecting this invitation, you can safely ignore this email. No account will be created.

deactivated.subject=Your LiveContext account has been deactivated
deactivated.title=Your account has been deactivated
deactivated.body=Your LiveContext account has been deactivated as requested.
deactivated.retention=Your data is kept for {days} days. After that, all of it (workflows, agents, conversations, files, credentials and publications) is *permanently deleted*.
deactivated.undo=If you change your mind, sign in again within {days} days and we will offer to restore your account. You can also reach us at {supportEmail}.
deactivated.action=Sign in again
deactivated.footer=We are sorry to see you go. Thank you for using LiveContext.

restored.subject=Your LiveContext account has been restored
restored.title=Your account has been restored
restored.body=Your LiveContext account has been restored and the scheduled deletion has been cancelled. Nothing was deleted, and everything (workflows, agents, conversations, files, credentials and publications) is exactly as you left it.
restored.notyou=If this was not you, contact us at {supportEmail} immediately.
restored.footer=Welcome back. Thank you for using LiveContext.

purged.subject=Your LiveContext data has been permanently deleted
purged.title=Your data has been deleted
purged.body=The {days}-day grace period for your LiveContext account has ended.
purged.detail=Everything has been permanently deleted: workflows and their run history, agents and conversations, interfaces and data sources, files and stored objects, API credentials, and marketplace publications.
purged.welcome=If you would like to use LiveContext again in the future, you are welcome to create a new account at any time.
purged.action=Create a new account
purged.footer=Thank you for having used LiveContext. We hope to see you again.

reset.subject=Reset your LiveContext password
reset.title=Reset your password
reset.body=Someone asked to reset the password for this LiveContext account.
reset.action=Choose a new password
reset.expiry=The link works once and expires in {minutes} minutes.
reset.fallback=If the button does not work, copy and paste this link: {url}
reset.ignore=If you did not ask for this, you can ignore this email. Your password has not changed and nobody has been given access.

squat.subject=Action needed: someone tried to link your LiveContext install
squat.title=Action needed on your cloud link
squat.body=Someone tried to register a self-hosted install that is already linked to your LiveContext account.
squat.wasyou=If this was you (you reinstalled, switched machines, or used a recovery image), there is nothing to do.
squat.wasnotyou=If this was *not* you, use the link below to reset the link and force the other party out.
squat.action=Reset cloud link
squat.expiry=The link expires in {minutes} minutes and can be used once.
