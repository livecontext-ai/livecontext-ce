# E-mails de compte (code de vérification, invitation d'organisation, désactivation /
# restauration / suppression, récupération du lien cloud). UTF-8. Parité et vraies traductions :
# AccountMailCatalogTest. Un segment *étoilé* s'affiche en gras en HTML (BrandedMail.emphasize).
common.greeting=Bonjour {name},
common.greetingNoName=Bonjour,
common.signature=- L'équipe LiveContext
common.footer=Vous recevez cet e-mail à l'adresse associée à votre compte LiveContext.

verify.subject=Bienvenue sur LiveContext : votre code de vérification
verify.preheader=Votre code de vérification LiveContext
verify.title=Bienvenue sur LiveContext
verify.intro=Merci pour votre inscription. Utilisez le code ci-dessous pour vérifier votre adresse e-mail et finaliser la création de votre compte.
verify.expiry=Ce code expire dans {minutes} minutes. Si vous ne l'avez pas demandé, vous pouvez ignorer cet e-mail.
verify.footer=Vous recevez cet e-mail parce qu'un compte LiveContext a été créé avec cette adresse.

invite.subject=Vous êtes invité à rejoindre {org} sur LiveContext
invite.preheader=Vous avez été invité à rejoindre {org} sur LiveContext
invite.title=Vous êtes invité
invite.body=*{inviter}* vous invite à rejoindre l'organisation *{org}* sur LiveContext en tant que *{role}*.
invite.action=Accepter l'invitation
invite.fallback=Si le bouton ne fonctionne pas, copiez et collez ce lien : {url}
invite.footer=Si vous n'attendiez pas cette invitation, vous pouvez ignorer cet e-mail. Aucun compte ne sera créé.

deactivated.subject=Votre compte LiveContext a été désactivé
deactivated.title=Votre compte a été désactivé
deactivated.body=Votre compte LiveContext a été désactivé, comme demandé.
deactivated.retention=Vos données sont conservées pendant {days} jours. Ensuite, tout est *supprimé définitivement* : workflows, agents, conversations, fichiers, identifiants et publications.
deactivated.undo=Si vous changez d'avis, reconnectez-vous dans les {days} jours et nous vous proposerons de restaurer votre compte. Vous pouvez aussi nous écrire à {supportEmail}.
deactivated.action=Se reconnecter
deactivated.footer=Nous sommes desoles de vous voir partir. Merci d'avoir utilise LiveContext.

restored.subject=Votre compte LiveContext a été restauré
restored.title=Votre compte a été restauré
restored.body=Votre compte LiveContext a été restauré et la suppression programmée a été annulée. Rien n'a été supprimé : workflows, agents, conversations, fichiers, identifiants et publications sont exactement comme vous les avez laissés.
restored.notyou=Si ce n'était pas vous, contactez-nous immédiatement à {supportEmail}.
restored.footer=Content de vous revoir. Merci d'utiliser LiveContext.

purged.subject=Vos données LiveContext ont été définitivement supprimées
purged.title=Vos données ont été supprimées
purged.body=Le délai de grâce de {days} jours pour votre compte LiveContext est arrivé à son terme.
purged.detail=Tout a ete definitivement supprime : les workflows et leur historique d'executions, les agents et les conversations, les interfaces et les sources de donnees, les fichiers et les objets stockes, les identifiants d'API et les publications sur la marketplace.
purged.welcome=Si vous souhaitez réutiliser LiveContext à l'avenir, vous pouvez créer un nouveau compte à tout moment.
purged.action=Créer un nouveau compte
purged.footer=Merci d'avoir utilise LiveContext. Nous esperons vous revoir.

reset.subject=Réinitialisez votre mot de passe LiveContext
reset.title=Réinitialisez votre mot de passe
reset.body=Quelqu'un a demandé la réinitialisation du mot de passe de ce compte LiveContext.
reset.action=Choisir un nouveau mot de passe
reset.expiry=Le lien est à usage unique et expire dans {minutes} minutes.
reset.fallback=Si le bouton ne fonctionne pas, copiez et collez ce lien : {url}
reset.ignore=Si vous n'êtes pas à l'origine de cette demande, ignorez cet e-mail. Votre mot de passe n'a pas changé et personne n'a obtenu d'accès.

squat.subject=Action requise : quelqu'un a tenté de lier votre installation LiveContext
squat.title=Action requise sur votre lien cloud
squat.body=Quelqu'un a tenté d'enregistrer une installation auto-hébergée déjà liée à votre compte LiveContext.
squat.wasyou=S'il s'agissait de vous (réinstallation, changement de machine ou image de restauration), il n'y a rien à faire.
squat.wasnotyou=Si ce n'était *pas* vous, utilisez le lien ci-dessous pour réinitialiser la liaison et exclure l'autre partie.
squat.action=Réinitialiser le lien cloud
squat.expiry=Le lien expire dans {minutes} minutes et ne peut être utilisé qu'une fois.
