# Correos de cuenta (código de verificación, invitación a una organización, desactivación /
# restauración / eliminación, recuperación del enlace con la nube). UTF-8. Paridad y traducciones
# reales: AccountMailCatalogTest. Un tramo *marcado* se muestra en negrita (BrandedMail.emphasize).
common.greeting=Hola {name}:
common.greetingNoName=Hola:
common.signature=- El equipo de LiveContext
common.footer=Recibes este correo en la dirección asociada a tu cuenta de LiveContext.

verify.subject=Bienvenido a LiveContext: tu código de verificación
verify.preheader=Tu código de verificación de LiveContext
verify.title=Bienvenido a LiveContext
verify.intro=Gracias por registrarte. Usa el código de abajo para verificar tu dirección de correo y terminar de crear tu cuenta.
verify.expiry=Este código caduca en {minutes} minutos. Si no lo has pedido, puedes ignorar este correo.
verify.footer=Recibes este correo porque se ha creado una cuenta de LiveContext con esta dirección.

invite.subject=Te han invitado a unirte a {org} en LiveContext
invite.preheader=Te han invitado a unirte a {org} en LiveContext
invite.title=Tienes una invitación
invite.body=*{inviter}* te ha invitado a unirte a la organización *{org}* en LiveContext como *{role}*.
invite.action=Aceptar la invitación
invite.fallback=Si el botón no funciona, copia y pega este enlace: {url}
invite.footer=Si no esperabas esta invitación, puedes ignorar este correo. No se creará ninguna cuenta.

deactivated.subject=Tu cuenta de LiveContext se ha desactivado
deactivated.title=Tu cuenta se ha desactivado
deactivated.body=Tu cuenta de LiveContext se ha desactivado, como pediste.
deactivated.retention=Tus datos se conservan {days} días. Después se elimina todo *de forma permanente*: flujos de trabajo, agentes, conversaciones, archivos, credenciales y publicaciones.
deactivated.undo=Si cambias de opinión, vuelve a iniciar sesión antes de {days} días y te ofreceremos restaurar la cuenta. También puedes escribirnos a {supportEmail}.
deactivated.action=Volver a iniciar sesión
deactivated.footer=Sentimos que te vayas. Gracias por usar LiveContext.

restored.subject=Tu cuenta de LiveContext se ha restaurado
restored.title=Tu cuenta se ha restaurado
restored.body=Tu cuenta de LiveContext se ha restaurado y la eliminación programada se ha cancelado. No se ha borrado nada: flujos de trabajo, agentes, conversaciones, archivos, credenciales y publicaciones están tal como los dejaste.
restored.notyou=Si *no* has sido tú, contáctanos de inmediato en {supportEmail}.
restored.footer=Bienvenido de nuevo. Gracias por usar LiveContext.

purged.subject=Tus datos de LiveContext se han eliminado de forma permanente
purged.title=Tus datos se han eliminado
purged.body=El periodo de gracia de {days} días de tu cuenta de LiveContext ha terminado.
purged.detail=Todo se ha eliminado de forma permanente: los flujos de trabajo y su historial de ejecuciones, los agentes y las conversaciones, las interfaces y las fuentes de datos, los archivos y los objetos almacenados, las credenciales de API y las publicaciones en el marketplace.
purged.welcome=Si quieres volver a usar LiveContext en el futuro, puedes crear una cuenta nueva cuando quieras.
purged.action=Crear una cuenta nueva
purged.footer=Gracias por haber usado LiveContext. Esperamos volver a verte.

reset.subject=Restablece tu contraseña de LiveContext
reset.title=Restablece tu contraseña
reset.body=Alguien ha pedido restablecer la contraseña de esta cuenta de LiveContext.
reset.action=Elegir una contraseña nueva
reset.expiry=El enlace se usa una sola vez y caduca en {minutes} minutos.
reset.fallback=Si el botón no funciona, copia y pega este enlace: {url}
reset.ignore=Si no lo has pedido tú, puedes ignorar este correo. Tu contraseña no ha cambiado y nadie ha obtenido acceso.

squat.subject=Acción necesaria: alguien ha intentado vincular tu instalación de LiveContext
squat.title=Acción necesaria en tu enlace con la nube
squat.body=Alguien ha intentado registrar una instalación autoalojada que ya está vinculada a tu cuenta de LiveContext.
squat.wasyou=Si has sido tú (una reinstalación, un cambio de equipo o una imagen de recuperación), no hay nada que hacer.
squat.wasnotyou=Si *no* has sido tú, usa el enlace de abajo para restablecer la vinculación y expulsar a la otra parte.
squat.action=Restablecer el enlace con la nube
squat.expiry=El enlace caduca en {minutes} minutos y solo se puede usar una vez.
