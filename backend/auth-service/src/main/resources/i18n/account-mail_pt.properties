# E-mails de conta (código de verificação, convite de organização, desativação / restauração /
# exclusão, recuperação do vínculo com a nuvem). UTF-8. Paridade e traduções reais:
# AccountMailCatalogTest. Um trecho *marcado* aparece em negrito no HTML (BrandedMail.emphasize).
common.greeting=Olá {name},
common.greetingNoName=Olá,
common.signature=- Equipe LiveContext
common.footer=Você recebe este e-mail no endereço associado à sua conta LiveContext.

verify.subject=Bem-vindo ao LiveContext: seu código de verificação
verify.preheader=Seu código de verificação do LiveContext
verify.title=Bem-vindo ao LiveContext
verify.intro=Obrigado por se cadastrar. Use o código abaixo para verificar seu endereço de e-mail e concluir a criação da conta.
verify.expiry=Este código expira em {minutes} minutos. Se você não o solicitou, pode ignorar este e-mail.
verify.footer=Você recebe este e-mail porque uma conta LiveContext foi criada com este endereço.

invite.subject=Você foi convidado a entrar em {org} no LiveContext
invite.preheader=Você foi convidado a entrar em {org} no LiveContext
invite.title=Você foi convidado
invite.body=*{inviter}* convidou você a entrar na organização *{org}* no LiveContext como *{role}*.
invite.action=Aceitar o convite
invite.fallback=Se o botão não funcionar, copie e cole este link: {url}
invite.footer=Se você não esperava este convite, pode ignorar este e-mail. Nenhuma conta será criada.

deactivated.subject=Sua conta LiveContext foi desativada
deactivated.title=Sua conta foi desativada
deactivated.body=Sua conta LiveContext foi desativada, conforme solicitado.
deactivated.retention=Seus dados ficam guardados por {days} dias. Depois disso, tudo é *excluído definitivamente*: workflows, agentes, conversas, arquivos, credenciais e publicações.
deactivated.undo=Se mudar de ideia, entre novamente em até {days} dias e ofereceremos a restauração da conta. Você também pode nos escrever em {supportEmail}.
deactivated.action=Entrar novamente
deactivated.footer=Lamentamos que voce esteja saindo. Obrigado por usar o LiveContext.

restored.subject=Sua conta LiveContext foi restaurada
restored.title=Sua conta foi restaurada
restored.body=Sua conta LiveContext foi restaurada e a exclusão programada foi cancelada. Nada foi excluído: workflows, agentes, conversas, arquivos, credenciais e publicações estão exatamente como você deixou.
restored.notyou=Se não foi você, entre em contato conosco imediatamente em {supportEmail}.
restored.footer=Bem-vindo de volta. Obrigado por usar o LiveContext.

purged.subject=Seus dados do LiveContext foram excluídos definitivamente
purged.title=Seus dados foram excluídos
purged.body=O prazo de carência de {days} dias da sua conta LiveContext terminou.
purged.detail=Tudo foi excluido definitivamente: os workflows e o historico de execucoes, os agentes e as conversas, as interfaces e as fontes de dados, os arquivos e os objetos armazenados, as credenciais de API e as publicacoes no marketplace.
purged.welcome=Se quiser usar o LiveContext novamente no futuro, pode criar uma nova conta a qualquer momento.
purged.action=Criar uma nova conta
purged.footer=Obrigado por ter usado o LiveContext. Esperamos ve-lo novamente.

reset.subject=Redefina sua senha do LiveContext
reset.title=Redefina sua senha
reset.body=Alguém pediu a redefinição da senha desta conta LiveContext.
reset.action=Escolher uma nova senha
reset.expiry=O link funciona uma única vez e expira em {minutes} minutos.
reset.fallback=Se o botão não funcionar, copie e cole este link: {url}
reset.ignore=Se não foi você que pediu, pode ignorar este e-mail. Sua senha não mudou e ninguém obteve acesso.

squat.subject=Ação necessária: alguém tentou vincular sua instalação do LiveContext
squat.title=Ação necessária no seu vínculo com a nuvem
squat.body=Alguém tentou registrar uma instalação auto-hospedada que já está vinculada à sua conta LiveContext.
squat.wasyou=Se foi você (uma reinstalação, troca de máquina ou imagem de recuperação), não é preciso fazer nada.
squat.wasnotyou=Se *não* foi você, use o link abaixo para redefinir o vínculo e expulsar a outra parte.
squat.action=Redefinir o vínculo com a nuvem
squat.expiry=O link expira em {minutes} minutos e pode ser usado uma única vez.
