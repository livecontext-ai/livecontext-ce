<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 260" width="720" height="260" role="img">
  <style>
    /* The values below ARE the app theme tokens (globals.css), not a palette of their
       own: --page/--line/--ink/--muted mirror bg-secondary/border-color/text-primary/
       text-secondary. The app is a WARM neutral in dark (#171614), so a cold blue-grey
       artwork reads as foreign on it. */
    :root {
      --page: #f5f6f8;
      --line: #d5dbe4;
      --ink: #111827;
      --muted: #4b5563;
      --mark: #111827;
    }
    /* An img cannot see the app's .dark class, only the OS PREFERENCE, so one viewer in
       the wild has a theme this file cannot follow: app forced dark, OS set light.
       The artwork therefore paints its OWN background and is a self-contained card. That
       is deliberate, and it was measured: dropping the background so the panel shows
       through looks tidier in the three matching cases and makes the crossed one
       UNREADABLE - light-mode ink (#111827) on a #171614 dialog. A light card inside a
       dark dialog reads as foreign; invisible ink reads as nothing. Legibility wins. */
    @media (prefers-color-scheme: dark) {
      :root {
        --page: #1f1e1b;
        --line: #5e5a54;
        --ink: #edecea;
        --muted: #a39f97;
        --mark: #edecea;
      }
    }
    /* DO NOT draw product UI here. An earlier version of this illustration mimicked a node
       card with category rows and masked key rows; it read as a SCREENSHOT of the app and
       told people the interface looks like that, which it does not. Two icons and a line of
       text each: the icons say what is new, the panel's own body text explains it.

       Type is sized for the SMALLEST box this gets, not the canvas. The panel caps at
       max-w-lg, so the media is 464 CSS px wide on desktop and about 310 on a phone: this
       720-wide canvas is displayed at 0.64x and 0.43x. A 24px line survives both. */
    text {
      font-family: ui-sans-serif, system-ui, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      text-anchor: middle;
    }
    .t-title { font-size: 32px; font-weight: 600; fill: var(--ink); }
    .t-sub   { font-size: 24px; fill: var(--muted); }
  </style>

  <rect width="720" height="260" fill="var(--page)"/>

  <!-- ── Left: the TypeSafe mark, the new engine behind Classify ─────────────── -->
  <!-- The provider icon, verbatim from /icons/services/typesafe.svg, in a 50x73 box -->
  <g transform="translate(155,44) scale(0.506)">
    <path fill="var(--mark)" fill-rule="evenodd" clip-rule="evenodd" d="M76.458 17.565v24.833l22.357 14.524.006 54.989L49.405 144l-27.041-17.559V100.92L0 86.396v-54.3l2.129-1.387L49.41 0zM35.604 123.9l13.795 8.959 36.163-23.496-13.788-8.952zm18.472-61.904v24.407l-22.37 14.525v14.365l35.41-22.996V53.529zm22.382 30.313 13.015 8.454V61.989l-13.015-8.454zM13.247 83.86l13.788 8.96 13.794-8.96-13.788-8.953zM9.342 37.162V75.26l13.022-8.46V42.392L44.74 27.856v-13.69zm22.364 29.632 13.028 8.46V61.989l-13.028-8.46zm3.898-21.871 13.807 8.965 13.794-8.96-13.8-8.964zm18.478-17.067 13.033 8.466V22.638l-13.033-8.473z"/>
  </g>

  <text class="t-title" x="180" y="172">TypeSafe Jev</text>
  <text class="t-sub" x="180" y="208">a typed engine for Classify</text>

  <!-- ── Divider ─────────────────────────────────────────────────────────────── -->
  <line x1="360" y1="52" x2="360" y2="208" stroke="var(--line)" stroke-width="2"/>

  <!-- ── Right: your own provider keys ──────────────────────────────────────── -->
  <g transform="translate(508,44)" stroke="var(--mark)" stroke-width="5" fill="none"
     stroke-linecap="round" stroke-linejoin="round">
    <circle cx="18" cy="21" r="14"/>
    <path d="M29 31 L62 64"/>
    <path d="M51 53 L43 61 L51 69"/>
    <path d="M62 64 L54 72"/>
  </g>

  <text class="t-title" x="540" y="172">Your own keys</text>
  <text class="t-sub" x="540" y="208">for agents, chats and nodes</text>
</svg>
